<style id="app-style">
:root{
  --orange:#E86227;
  --orange-dark:#C24E17;
  --yellow:#FFC919;
  --plum:#331832;
  --plum-soft:#4E2E4C;
  --cream:#FFFAEB;
  --white:#FFFFFF;
  --ink:#331832;
  --ink-soft:rgba(51,24,50,.72);
  --ink-faint:rgba(51,24,50,.5);
  --line:rgba(51,24,50,.14);
  --radius-lg:28px;
  --radius-md:18px;
  --radius-sm:10px;
  --shadow:0 20px 44px -22px rgba(51,24,50,.4);
  --maxw:1180px;
  color-scheme:light;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:16px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block;}
[hidden]{display:none!important;}
a{color:inherit;text-decoration:none;}
button{font:inherit;}
h1,h2,h3,.disp{font-family:'Fraunces',Georgia,serif;}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.08;}
p{margin:0;}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:24px;}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'Montserrat',sans-serif;font-weight:800;font-size:.72rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--orange);
}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--yellow);border:1.5px solid var(--orange);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 26px;border-radius:100px;font-weight:700;font-size:.95rem;
  border:2px solid transparent;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--orange);color:var(--white);box-shadow:0 10px 24px -10px rgba(232,98,39,.6);}
.btn-primary:hover{background:var(--orange-dark);}
.btn-ghost{background:transparent;border-color:var(--plum);color:var(--plum);}
.btn-ghost:hover{background:var(--plum);color:var(--cream);}
.btn-light{background:var(--cream);color:var(--plum);}
.btn-light:hover{background:var(--white);}
.btn-sm{padding:9px 16px;font-size:.82rem;border-radius:100px;}
.btn-danger{background:transparent;border-color:#B23A3A;color:#B23A3A;}
.btn-danger:hover{background:#B23A3A;color:var(--white);}
.icon{width:22px;height:22px;flex-shrink:0;}
.icon-lg{width:30px;height:30px;}

/* ---------- Nav ---------- */
#site-nav{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:50;
  background:var(--orange);
  box-shadow:0 2px 14px -6px rgba(51,24,50,.4);
}
.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;}
.brand-mark{background:var(--cream);color:var(--orange);}
.brand-mark text{fill:var(--plum);}
.brand-name{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:700;color:var(--cream);}
.brand-tag{display:block;font-family:'Montserrat',sans-serif;font-weight:800;font-size:.55rem;letter-spacing:.16em;color:var(--plum);text-transform:uppercase;margin-top:-2px;}
.nav-links{display:flex;align-items:center;gap:4px;}
.nav-links a{
  padding:10px 14px;border-radius:100px;font-weight:600;font-size:.92rem;color:rgba(255,250,235,.88);
  transition:background .15s ease,color .15s ease;
}
.nav-links a:hover{background:rgba(255,250,235,.2);color:var(--white);}
.nav-links a.active{background:var(--plum);color:var(--cream);}
.nav-cta{display:flex;align-items:center;gap:10px;}
.nav-toggle{display:none;background:none;border:none;cursor:pointer;padding:8px;color:var(--cream);}
@media (max-width:860px){
  .nav-links{
    position:absolute;top:100%;left:0;right:0;background:var(--cream);flex-direction:column;align-items:stretch;
    padding:12px 24px 28px;gap:4px;transform:translateY(-8px);opacity:0;pointer-events:none;transition:opacity .18s ease, transform .18s ease;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);box-shadow:0 18px 32px -20px rgba(51,24,50,.35);
    max-height:80dvh;overflow-y:auto;
  }
  .nav-links.open{opacity:1;transform:translateY(0);pointer-events:auto;}
  .nav-links a{padding:14px 10px;font-size:1.05rem;text-align:left;color:var(--ink-soft);}
  .nav-links a:hover{background:rgba(232,98,39,.1);color:var(--orange-dark);}
  .nav-links a.active{background:var(--plum);color:var(--cream);}
  .nav-toggle{display:inline-flex;}
}
@media (max-width:480px){
  section{padding-block:52px;}
  .hero{padding-block:40px 24px;}
  .section-tight{padding-block:40px;}
  .card,.contact-card,.post-card{padding:20px;}
  .section-head{margin-bottom:32px;}
  .modal{padding:22px;}
}

/* ---------- Wave dividers ---------- */
.wave{display:block;width:100%;height:44px;position:relative;top:1px;}
.wave-cream-to-plum{color:var(--cream);}
.wave-plum-to-cream{color:var(--cream);}
.wave-accent{color:var(--orange);margin-block:8px 32px;}

/* ---------- Sections ---------- */
.page{display:none;}
.page.active{display:block;}
section{padding-block:76px;}
.page > section:first-child:not(.hero){padding-top:0;}
.section-plum{background:var(--plum);color:var(--cream);padding-top:0;}
.section-plum .wrap{padding-top:44px;}
.section-tight{padding-block:56px;}
.section-head{max-width:640px;margin-bottom:44px;}
.section-head h2{font-size:clamp(1.7rem,3.4vw,2.5rem);margin-top:10px;}
.section-head p{margin-top:14px;color:var(--ink-soft);font-size:1.02rem;}
.section-plum .section-head p{color:rgba(255,255,255,.82);}

/* ---------- Hero ---------- */
.hero{padding-block:64px 40px;position:relative;}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;}
.hero h1{font-size:clamp(2.3rem,5vw,3.7rem);color:var(--plum);}
.hero h1 em{font-style:normal;color:var(--orange);}
.hero-lede{margin-top:20px;font-size:1.1rem;color:var(--ink-soft);max-width:46ch;}
.hero-actions{display:flex;gap:14px;margin-top:32px;flex-wrap:wrap;}
.hero-badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:36px;}
.badge{
  padding:8px 16px;border-radius:100px;background:var(--white);border:1px solid var(--line);
  font-weight:700;font-size:.82rem;color:var(--plum-soft);
}
.hero-mark{
  aspect-ratio:1/1;max-width:340px;margin-inline:auto;background:var(--orange);border-radius:44px;
  display:flex;align-items:center;justify-content:center;position:relative;box-shadow:var(--shadow);
}
.hero-mark .rays{position:absolute;top:14%;left:50%;transform:translateX(-50%);display:flex;gap:10px;}
.hero-mark .rays span{width:5px;height:34px;background:var(--yellow);border-radius:4px;}
.hero-mark .rays span:nth-child(2){height:44px;}
.hero-mark .rays span:nth-child(4){height:44px;}
.hero-bubble{
  width:64%;aspect-ratio:1/.72;background:var(--yellow);border-radius:26px;position:relative;
  display:flex;align-items:center;justify-content:center;margin-top:8%;
}
.hero-bubble::after{content:"";position:absolute;bottom:-16px;left:26%;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:20px solid var(--yellow);}
.hero-bubble span{font-family:'Fraunces',serif;font-weight:700;font-size:3.2rem;color:var(--plum);}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr;}.hero-mark{margin-top:20px;}}

/* ---------- Cards / grids ---------- */
.grid{display:grid;gap:22px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-5{grid-template-columns:repeat(5,1fr);}
@media (max-width:980px){.grid-3{grid-template-columns:repeat(2,1fr);}.grid-5{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.grid-2,.grid-3,.grid-5{grid-template-columns:1fr;}}

.card{
  background:var(--white);border-radius:var(--radius-md);padding:26px;border:1px solid var(--line);
}
.card-persona{background:var(--yellow);border:none;padding:26px;border-radius:var(--radius-md);}
.card-persona h3{font-size:1.1rem;color:var(--plum);}
.card-persona .kicker{display:block;font-weight:800;font-size:.7rem;letter-spacing:.1em;color:var(--orange-dark);text-transform:uppercase;margin:4px 0 12px;}
.card-persona ul{list-style:none;margin:0 0 12px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;}
.card-persona li{font-weight:600;font-size:.92rem;position:relative;padding-left:14px;}
.card-persona li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--orange);}
.card-persona p{font-size:.9rem;color:var(--plum-soft);}

.service-card{display:flex;flex-direction:column;gap:14px;}
.service-icon{
  width:52px;height:52px;border-radius:16px;background:var(--cream);display:flex;align-items:center;justify-content:center;color:var(--orange);
}
.service-card h3{font-size:1.15rem;}
.service-card p{color:var(--ink-soft);font-size:.95rem;}

.value-row{display:flex;flex-wrap:wrap;gap:14px;}
.value-pill{
  display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--line);
  border-radius:100px;padding:10px 18px 10px 12px;font-weight:700;font-size:.9rem;
}
.value-pill .dot{width:34px;height:34px;border-radius:50%;background:var(--orange);color:var(--white);display:flex;align-items:center;justify-content:center;}

/* portfolio */
.case-card{
  border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--line);background:var(--white);
  display:flex;flex-direction:column;
}
.case-visual{
  min-height:140px;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;
  font-weight:700;font-size:clamp(1.05rem,4vw,1.5rem);line-height:1.25;color:var(--white);text-align:center;padding:18px;
}
.case-visual-photo{background-size:cover;background-position:center;}
.case-body{padding:20px;display:flex;flex-direction:column;gap:8px;flex:1;}
.case-cat{font-weight:800;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--orange-dark);}
.case-body h3{font-size:1.08rem;}
.case-body p{color:var(--ink-soft);font-size:.9rem;flex:1;}
.case-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}

/* posts */
.post-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-md);padding:26px;}
.post-meta{display:flex;align-items:center;gap:10px;color:var(--ink-faint);font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.post-card h3{margin-top:10px;font-size:1.3rem;}
.post-excerpt{margin-top:10px;color:var(--ink-soft);}
.post-body{margin-top:14px;color:var(--ink-soft);white-space:pre-wrap;border-top:1px dashed var(--line);padding-top:14px;}
.post-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
.post-list{display:flex;flex-direction:column;gap:18px;}

/* contact */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
@media (max-width:700px){.contact-grid{grid-template-columns:1fr;}}
.contact-card{background:var(--white);border-radius:var(--radius-md);padding:24px;display:flex;gap:16px;align-items:flex-start;border:1px solid var(--line);}
.contact-card .service-icon{background:var(--cream);}
.contact-card h3{font-size:1rem;}
.copy-row{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;}
.copy-value{font-weight:700;font-size:.98rem;color:var(--plum);word-break:break-word;}

/* footer */
footer{background:var(--plum);color:rgba(255,250,235,.86);padding-block:52px 30px;}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:32px;}
@media (max-width:700px){.footer-grid{grid-template-columns:1fr;}}
footer h4{font-family:'Montserrat',sans-serif;font-weight:800;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--yellow);margin:0 0 14px;}
footer a{display:block;padding:5px 0;color:rgba(255,250,235,.86);font-size:.92rem;}
footer a:hover{color:var(--yellow);}
.footer-bottom{
  margin-top:40px;padding-top:20px;border-top:1px solid rgba(255,250,235,.16);
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  font-size:.82rem;color:rgba(255,250,235,.6);
}

/* admin */
.post-actions-admin{display:inline-flex;gap:10px;}
#admin-bar{
  position:fixed;left:16px;bottom:16px;z-index:80;background:var(--plum);color:var(--cream);
  border-radius:100px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:12px;
  box-shadow:0 16px 32px -14px rgba(0,0,0,.5);font-size:.85rem;font-weight:700;
}
#admin-bar .dot{width:8px;height:8px;border-radius:50%;background:#6FCF97;}
.section-toolbar{display:flex;justify-content:flex-end;margin-bottom:18px;}
.empty-note{color:var(--ink-faint);font-style:italic;padding:20px 0;}

/* modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(51,24,50,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;
  padding:40px 16px;overflow-y:auto;
}
.modal{
  background:var(--white);border-radius:var(--radius-md);padding:28px;max-width:560px;width:100%;
  box-shadow:var(--shadow);
}
.modal h3{font-size:1.3rem;margin-bottom:18px;}
.field{margin-bottom:16px;}
.field label{display:block;font-weight:700;font-size:.82rem;margin-bottom:6px;color:var(--plum-soft);}
.field input,.field textarea{
  width:100%;padding:11px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--line);
  font-family:'Montserrat',sans-serif;font-size:.95rem;background:var(--cream);color:var(--ink);
}
.field textarea{resize:vertical;min-height:90px;}
.field input:focus,.field textarea:focus{outline:2px solid var(--orange);outline-offset:1px;}
.field-image .image-preview{
  width:100%;aspect-ratio:16/10;border-radius:var(--radius-sm);background:var(--cream);
  display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px;
  border:1.5px dashed var(--line);
}
.field-image .image-preview img{width:100%;height:100%;object-fit:cover;}
.image-preview-empty{color:var(--ink-faint);font-size:.85rem;}
.field-image input[type="file"]{width:100%;font-size:.85rem;margin-bottom:8px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;flex-wrap:wrap;}

/* toast */
#toast{
  position:fixed;bottom:16px;right:16px;z-index:120;background:var(--plum);color:var(--cream);
  padding:14px 18px;border-radius:var(--radius-sm);font-weight:600;font-size:.9rem;box-shadow:var(--shadow);
  max-width:320px;transform:translateY(20px);opacity:0;pointer-events:none;transition:transform .2s ease,opacity .2s ease;
}
#toast.show{transform:translateY(0);opacity:1;}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function fmtDate(iso){
  try{
    var d = new Date(iso+"T00:00:00");
    return d.toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"});
  }catch(e){ return iso; }
}
function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }

function resizeImageFile(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    if(!file.type || file.type.indexOf("image/") !== 0){ reject(new Error("not an image")); return; }
    if(file.size > 15 * 1024 * 1024){ reject(new Error("too large")); return; }
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error("read failed")); };
    reader.onload = function(){
      var img = new Image();
      img.onerror = function(){ reject(new Error("decode failed")); };
      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, cw, ch);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

    '<div><span class="brand-name" style="color:var(--cream);">Atlas</span><span class="brand-tag" style="color:var(--yellow);">Communication 360°</span>'+
      '<p style="margin-top:14px;max-width:32ch;color:rgba(255,250,235,.72);font-size:.92rem;">Faire émerger les idées et les faire rayonner.</p></div>'+
    '<div><h4>Navigation</h4>'+links+'</div>'+
    '<div><h4>Contact</h4><a href="#contact" data-hash="contact">contact@atlas-communication-360.com</a><a href="#contact" data-hash="contact">06 02 26 39 76</a><a href="https://instagram.com/Atlas_Communication_360" target="_blank" rel="noopener">@Atlas_Communication_360</a></div>'+
  '</div>'+
  '<div class="wrap footer-bottom"><span>© '+new Date().getFullYear()+' Atlas Communication 360°</span><span>Site vitrine avec espace de contenu intégré</span></div>'+
  '</footer>';
}

function pageWrap(id, inner){
  return '<section id="page-'+id+'" class="page">'+inner+'</section>';
}

function appHTML(){
  return ''+
    navHTML()+
    '<main>'+
      pageWrap("accueil", heroHTML()+servicesPreviewDivider())+
      pageWrap("agence", agenceHTML())+
      pageWrap("services", servicesHTML())+
      pageWrap("realisations", realisationsHTML())+
      pageWrap("actus", actusHTML())+
      pageWrap("contact", contactHTML())+
    '</main>'+
    footerHTML()+
    '<div id="admin-bar" class="admin-only" hidden><span class="dot"></span> Mode édition actif <button class="btn btn-light btn-sm" data-action="admin-help">?</button></div>'+
    '<div id="toast"></div>';
}
function servicesPreviewDivider(){ return ""; }

/* ---------- render / router ---------- */
var appRoot = document.getElementById("app");

function paint(){
  appRoot.innerHTML = appHTML();
  if(canEdit){
    appRoot.querySelectorAll(".admin-only").forEach(function(el){ el.hidden = false; });
  }
  bindEvents();
  applyRoute();
}

function applyRoute(){
  var hash = (location.hash||"#accueil").replace("#","");
  var valid = NAV_ITEMS.some(function(i){return i.hash===hash;});
  if(!valid) hash = "accueil";
  document.querySelectorAll(".page").forEach(function(p){
    p.classList.toggle("active", p.id === "page-"+hash);
  });
  document.querySelectorAll("[data-hash]").forEach(function(a){
    a.classList.toggle("active", a.getAttribute("data-hash") === hash);
  });
  var navLinks = document.getElementById("nav-links");
  if(navLinks) navLinks.classList.remove("open");
  var toggle = document.getElementById("nav-toggle");
  if(toggle) toggle.setAttribute("aria-expanded","false");
  window.scrollTo({top:0, behavior:"auto"});
}

window.addEventListener("hashchange", applyRoute);

/* ---------- toast ---------- */
var toastTimer = null;
function showToast(msg){
  var t = document.getElementById("toast");
  if(!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 3200);
}

/* ---------- modal ---------- */
function openModal(title, fields, onSave, onDeleteLabel, onDelete){
  var backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  var fieldsHTML = fields.map(function(f){
    if(f.type === "image"){
      return '<div class="field field-image">'+
        '<label>'+f.label+'</label>'+
        '<div class="image-preview" id="preview-'+f.key+'">'+
          (f.value ? '<img src="'+f.value+'" alt="">' : '<span class="image-preview-empty">Aucune photo</span>')+
        '</div>'+
        '<input type="file" accept="image/*" id="file-'+f.key+'">'+
        (f.value ? '<button type="button" class="btn btn-ghost btn-sm" data-remove-image="'+f.key+'">Retirer la photo</button>' : '')+
        '<input type="hidden" id="fld-'+f.key+'" value="'+esc(f.value||"")+'">'+
      '</div>';
    }
    var tag = f.type === "textarea" ? "textarea" : "input";
    var attrs = f.type && f.type !== "textarea" ? ' type="'+f.type+'"' : "";
    var valueAttr = tag === "input" ? ' value="'+esc(f.value||"")+'"' : "";
    var content = tag === "textarea" ? esc(f.value||"") : "";
    return '<div class="field"><label for="fld-'+f.key+'">'+f.label+'</label><'+tag+' id="fld-'+f.key+'"'+attrs+valueAttr+'>'+content+'</'+tag+'></div>';
  }).join("");
  backdrop.innerHTML =
    '<div class="modal">'+
      '<h3>'+title+'</h3>'+
      '<form id="modal-form">'+fieldsHTML+
        '<div class="modal-actions">'+
          (onDelete ? '<button type="button" class="btn btn-danger btn-sm" id="modal-delete" style="margin-right:auto;">'+(onDeleteLabel||"Supprimer")+'</button>' : "")+
          '<button type="button" class="btn btn-ghost btn-sm" id="modal-cancel">Annuler</button>'+
          '<button type="submit" class="btn btn-primary btn-sm">Enregistrer</button>'+
        '</div>'+
      '</form>'+
    '</div>';
  document.body.appendChild(backdrop);
  backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });
  function close(){ backdrop.remove(); }
  fields.forEach(function(f){
    if(f.type !== "image") return;
    var fileInput = backdrop.querySelector("#file-"+f.key);
    var hidden = backdrop.querySelector("#fld-"+f.key);
    var preview = backdrop.querySelector("#preview-"+f.key);
    fileInput.addEventListener("change", function(){
      var file = fileInput.files && fileInput.files[0];
      if(!file) return;
      resizeImageFile(file, 1000, 0.82).then(function(dataUrl){
        hidden.value = dataUrl;
        preview.innerHTML = '<img src="'+dataUrl+'" alt="">';
      }).catch(function(){ showToast("Impossible de charger cette photo (format ou taille non pris en charge)."); });
    });
    var removeBtn = backdrop.querySelector('[data-remove-image="'+f.key+'"]');
    if(removeBtn) removeBtn.addEventListener("click", function(){
      hidden.value = "";
      preview.innerHTML = '<span class="image-preview-empty">Aucune photo</span>';
      removeBtn.remove();
    });
  });
  backdrop.querySelector("#modal-cancel").addEventListener("click", close);
  if(onDelete){
    backdrop.querySelector("#modal-delete").addEventListener("click", function(){ close(); onDelete(); });
  }
  backdrop.querySelector("#modal-form").addEventListener("submit", function(e){
    e.preventDefault();
    var values = {};
    fields.forEach(function(f){ values[f.key] = backdrop.querySelector("#fld-"+f.key).value.trim(); });
    close();
    onSave(values);
  });
  var firstInput = backdrop.querySelector("input,textarea");
  if(firstInput) firstInput.focus();
}

function confirmDialog(message, confirmLabel, onConfirm){
  var backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML =
    '<div class="modal">'+
      '<h3>'+message+'</h3>'+
      '<div class="modal-actions">'+
        '<button type="button" class="btn btn-ghost btn-sm" id="confirm-cancel">Annuler</button>'+
        '<button type="button" class="btn btn-danger btn-sm" id="confirm-ok">'+confirmLabel+'</button>'+
      '</div>'+
    '</div>';
  document.body.appendChild(backdrop);
  function close(){ backdrop.remove(); }
  backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });
  backdrop.querySelector("#confirm-cancel").addEventListener("click", close);
  backdrop.querySelector("#confirm-ok").addEventListener("click", function(){ close(); onConfirm(); });
}

/* ---------- publish ---------- */
var CSS_TEXT_SOURCE = document.getElementById("app-style") ? document.getElementById("app-style").textContent : "";
var FONT_LINKS = '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;0,900;1,600&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">';

function buildFullDocument(newState){
  var dataJSON = JSON.stringify(newState).replace(/</g, "\\u003c");
  var head =
    '<head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'+
    '<title>Atlas Communication 360°</title>'+
    '<meta name="description" content="Atlas Communication 360°, agence de communication : community management, création de contenu, stratégie de développement commercial, événementiel et formation.">'+
    FONT_LINKS+
    '<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}'+CSS_TEXT_SOURCE+'</style>'+
    '</head>';
  var body =
    '<body>'+
      '<div id="app"></div>'+
      '<script type="application/json" id="site-data">'+dataJSON+'<\/script>'+
      document.getElementById("app-script").outerHTML+
    '</body>';
  return '<!doctype html><html lang="fr">'+head+body+'</html>';
}

function persist(newState, successMsg){
  state = newState;
  paint();
  if(!artifactCap){ showToast("Aperçu local uniquement : publiez la page pour activer l'édition."); return; }
  artifactCap.publish(buildFullDocument(newState)).then(function(){
    showToast(successMsg || "Modifications publiées.");
  }).catch(function(err){
    var code = err && err.code;
    if(code === "conflict"){ showToast("Une autre modification vient d'être publiée, la page va se recharger."); return; }
    if(code === "not_writer" || code === "not_granted"){ showToast("Vous n'avez pas les droits pour publier ces modifications."); return; }
    showToast("La publication a échoué (" + (code||"erreur") + "). Réessayez.");
  });
}

/* ---------- admin actions ---------- */
function addPortfolio(){
  openModal("Nouvelle réalisation", [
    {key:"title", label:"Nom du client / projet", value:""},
    {key:"category", label:"Catégorie", value:""},
    {key:"description", label:"Description", type:"textarea", value:""},
    {key:"image", label:"Photo du projet (optionnel)", type:"image", value:""}
  ], function(v){
    if(!v.title) return;
    var next = JSON.parse(JSON.stringify(state));
    var colors = ["var(--orange)","var(--plum)","var(--orange-dark)","var(--plum-soft)"];
    next.portfolio.push({id:uid("p"), title:v.title, category:v.category||"Projet", description:v.description||"", image:v.image||"", color:colors[next.portfolio.length % colors.length]});
    persist(next, "Réalisation ajoutée.");
  });
}
function editPortfolio(id){
  var item = state.portfolio.find(function(p){return p.id===id;});
  if(!item) return;
  openModal("Modifier la réalisation", [
    {key:"title", label:"Nom du client / projet", value:item.title},
    {key:"category", label:"Catégorie", value:item.category},
    {key:"description", label:"Description", type:"textarea", value:item.description},
    {key:"image", label:"Photo du projet (optionnel)", type:"image", value:item.image||""}
  ], function(v){
    var next = JSON.parse(JSON.stringify(state));
    var it = next.portfolio.find(function(p){return p.id===id;});
    it.title = v.title||it.title; it.category = v.category||it.category; it.description = v.description||it.description; it.image = v.image||"";
    persist(next, "Réalisation modifiée.");
  }, "Supprimer", function(){ deletePortfolio(id); });
}
function deletePortfolio(id){
  var next = JSON.parse(JSON.stringify(state));
  next.portfolio = next.portfolio.filter(function(p){return p.id!==id;});
  persist(next, "Réalisation supprimée.");
}
function addPost(){
  var today = new Date().toISOString().slice(0,10);
  openModal("Nouvelle actualité", [
    {key:"title", label:"Titre", value:""},
    {key:"date", label:"Date (AAAA-MM-JJ)", value:today},
    {key:"excerpt", label:"Résumé court", type:"textarea", value:""},
    {key:"body", label:"Texte complet", type:"textarea", value:""}
  ], function(v){
    if(!v.title) return;
    var next = JSON.parse(JSON.stringify(state));
    next.posts.push({id:uid("n"), title:v.title, date:v.date||today, excerpt:v.excerpt||"", body:v.body||v.excerpt||""});
    persist(next, "Actualité publiée.");
  });
}
function editPost(id){
  var item = state.posts.find(function(p){return p.id===id;});
  if(!item) return;
  openModal("Modifier l'actualité", [
    {key:"title", label:"Titre", value:item.title},
    {key:"date", label:"Date (AAAA-MM-JJ)", value:item.date},
    {key:"excerpt", label:"Résumé court", type:"textarea", value:item.excerpt},
    {key:"body", label:"Texte complet", type:"textarea", value:item.body}
  ], function(v){
    var next = JSON.parse(JSON.stringify(state));
    var it = next.posts.find(function(p){return p.id===id;});
    it.title=v.title||it.title; it.date=v.date||it.date; it.excerpt=v.excerpt||it.excerpt; it.body=v.body||it.body;
    persist(next, "Actualité modifiée.");
  }, "Supprimer", function(){ deletePost(id); });
}
function deletePost(id){
  var next = JSON.parse(JSON.stringify(state));
  next.posts = next.posts.filter(function(p){return p.id!==id;});
  persist(next, "Actualité supprimée.");
}

/* ---------- events ---------- */
function bindEvents(){
  var toggle = document.getElementById("nav-toggle");
  var navLinks = document.getElementById("nav-links");
  if(toggle && navLinks){
    toggle.addEventListener("click", function(){
      var open = navLinks.classList.toggle("open");
      toggle.setAttribute("aria-expanded", open ? "true":"false");
      toggle.innerHTML = open ? icon("close") : icon("menu");
    });
  }

  appRoot.querySelectorAll("[data-copy]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var val = document.getElementById(btn.getAttribute("data-copy")).textContent;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(val).then(function(){ showToast("Copié : "+val); }).catch(function(){ showToast(val); });
      } else { showToast(val); }
    });
  });

  appRoot.querySelectorAll('[data-action="toggle-post"]').forEach(function(btn){
    btn.addEventListener("click", function(){
      var card = btn.closest(".post-card");
      var body = card.querySelector(".post-body");
      var willShow = body.hasAttribute("hidden");
      body.toggleAttribute("hidden");
      btn.textContent = willShow ? "Réduire" : "Lire la suite";
    });
  });

  var addPortfolioBtn = appRoot.querySelector('[data-action="add-portfolio"]');
  if(addPortfolioBtn) addPortfolioBtn.addEventListener("click", addPortfolio);
  var addPostBtn = appRoot.querySelector('[data-action="add-post"]');
  if(addPostBtn) addPostBtn.addEventListener("click", addPost);

  appRoot.querySelectorAll('[data-action="edit-portfolio"]').forEach(function(b){
    b.addEventListener("click", function(){ editPortfolio(b.getAttribute("data-id")); });
  });
  appRoot.querySelectorAll('[data-action="delete-portfolio"]').forEach(function(b){
    b.addEventListener("click", function(){ deletePortfolioConfirm(b.getAttribute("data-id")); });
  });
  appRoot.querySelectorAll('[data-action="edit-post"]').forEach(function(b){
    b.addEventListener("click", function(){ editPost(b.getAttribute("data-id")); });
  });
  appRoot.querySelectorAll('[data-action="delete-post"]').forEach(function(b){
    b.addEventListener("click", function(){ deletePostConfirm(b.getAttribute("data-id")); });
  });

  var helpBtn = appRoot.querySelector('[data-action="admin-help"]');
  if(helpBtn) helpBtn.addEventListener("click", function(){
    showToast("Vous voyez ce panneau car vous pouvez modifier cette page. Ajoutez ou éditez du contenu dans Réalisations et Actualités.");
  });
}

function deletePortfolioConfirm(id){
  var item = state.portfolio.find(function(p){return p.id===id;});
  if(!item) return;
  confirmDialog("Supprimer « "+esc(item.title)+" » ?", "Supprimer", function(){ deletePortfolio(id); });
}
function deletePostConfirm(id){
  var item = state.posts.find(function(p){return p.id===id;});
  if(!item) return;
  confirmDialog("Supprimer « "+esc(item.title)+" » ?", "Supprimer", function(){ deletePost(id); });
}

/* ---------- boot ---------- */
try{ document.documentElement.lang = "fr"; }catch(e){}
paint();

function initCapabilities(){
  if(!window.claude || !window.claude.use){ return; }
  Promise.all([
    window.claude.use("artifact").catch(function(){return null;}),
    window.claude.use("user").catch(function(){return null;})
  ]).then(function(res){
    artifactCap = res[0];
    var userCap = res[1];
    if(!userCap || !artifactCap){ canEdit = false; paint(); return; }
    return userCap.canEdit().then(function(v){
      canEdit = !!v;
      paint();
    });
  }).catch(function(){ canEdit = false; });
}
initCapabilities();

})();
</script>
